<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактирование дела</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
<form  th:object="${note}" th:action="@{'/register/' + ${note.getRegisterId()} + '/note'} " method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="container">
    <table class="table table-striped mt-20 text-center">
        <caption>Редактирование Дела номер: <span  th:text="${note.getNumber()}"/></caption>
        <thead>
        <tr>
            <th></th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <label>Номер:</label>
            <input type="number" class="form-control" th:field="*{number}"/>
        </tr>
        <tr>
            <label>Аннотация:</label>
            <input type="text" class="form-control" th:field="*{annotation}"/>
        </tr>
        <tr>
            <label>Примечание:</label>
            <input type="text" class="form-control" th:field="*{memo}"/>
        </tr>
        <tr>
            <label>Предметный указатель:</label>
            <input type="text" class="form-control" th:field="*{findSubject}"/>
        </tr>
        <tr>
            <label>Именной указатель:</label>
            <input type="text" class="form-control" th:field="*{findActor}"/>
        </tr>
        </tbody>
    </table>
    <button type="submit" class="floating-button">Внести</button>
    </div>
</form>

    <table class="table table-striped mt-20 text-center">
        <tr>
            <th>Предметный указатель:</th>
            <th>Именной указатель:</th>
        </tr>
        <tbody>
        <tr>
            <td>
                <div th:each="subject : ${note.getSubjects()}">
                    <p th:text="${subject.getName()}"></p>
                </div>
            </td>
            <td>
                <div th:each="actor : ${note.getActors()}">
                    <p th:text="${actor.getName()} + ' ' + ${actor.getPatronymic()} + ' ' + ${actor.getSurname()}"></p>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
