<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Template</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            font-size: 20px;
        }

        /* Style the header */
        .header {
            background-color: #d71515;
            padding: 0px;
            text-align: center;
            font-size: 20px;
        }

        /* Create three unequal columns that floats next to each other */
        .column {
            float: left;
            padding: 10px;
            height: 300px; /* Should be removed. Only for demonstration */
        }

        /* Left and right column */
        .column.side {
            width: 25%;
        }

        /* Middle column */
        .column.middle {
            width: 50%;
        }

        /* Clear floats after the columns */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Style the footer */
        .footer {
            background-color: #142c6b;
            padding: 10px;
            text-align: center;
        }

        /* Responsive layout - makes the three columns stack on top of each other instead of next to each other */
        @media (max-width: 600px) {
            .column.side, .column.middle {
                width: 100%;
            }
        }
        table {
            font-family: "Lucida Sans Unicode", "Lucida Grande", Sans-Serif;
            font-size: 20px;
            background: white;
            max-width: 70%;
            width: 70%;
            border-collapse: collapse;
            text-align: left;
        }
        caption {
            caption-side: top;
            text-align: center;
            padding: 10px 0;
            font-size: 25px;
        }
        th {
            font-weight: normal;
            color: #039;
            padding: 10px 15px;
        }

        td {
            border-bottom: 1px solid #ccc;
            color: #669;
            border-top: 1px solid #e8edff;
            padding: 10px 15px;
        }
        tr:hover td {
            background: #e8edff;
        }
        body {
            font-size: 20px;
            background: url(https://html5book.ru/wp-content/uploads/2015/07/background39.png);
        }
    </style>
</head>
<body>

<h2>CSS Template using Float</h2>
<p>In this example, we have created a header, three unequal columns and a footer. On smaller screens, the columns will stack on top of each other.</p>
<p>Resize the browser window to see the responsive effect.</p>

<div class="header">
    <h2>Номер Дела</h2>
</div>

<div class="row">
    <div class="column side">Column</div>
    <div class="column middle" style="background-color:#bbb;">Column</div>
    <div class="column side" style="background-color:#e3b00e;">Column</div>
</div>


<div class="footer">
    <p>Footer</p>
</div>

</body>
</html>
