<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Редактирование именного указателя</title>
  <!-- Required meta tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
</head>
<body>

<!--Navbar-->
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <p class="navbar-brand">Управление</p>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarActionContent" aria-controls="navbarActionContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarActionContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item">
        <a class="nav-link" th:href="@{'/'}" href="#"> Фонд №418</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="#" th:href="@{'/page/registers/' + ${register.getId()} + '/notes'}">Опись: <span th:text="${register.getName()}">№999</span></a>
      </li>
      <li class="nav-item">
        <p class="nav-link">Редактирование указателя: <span th:text="${actor.getName()} + ' ' + ${actor.getPatronymic()} + ' ' + ${actor.getSurname()}">Василий</span></p>
      </li>
    </ul>
    <form class="form-inline my-2 my-lg-0">
      <input class="form-control mr-2" type="search" placeholder="Искать везде" aria-label="Search">
      <button class="btn btn-outline-success my-2" type="submit">Найти</button>
    </form>
  </div>
</nav>

<br>

<div class="container-fluid">
  <div class="row">
    <!--        left bar-->
    <div class="container col-4 border ml-3">
        <form th:object="${actor}" th:action="@{'/actors/' + ${register.getId()} + '/actor/' + ${actor.getId()} + '/actorUpdate'}" method="post">
          <input type="hidden" th:field="*{id}"/>
          <!--        <input type="hidden" id="registerId" name="registerId" th:value="${register.getId()}"/>-->
          <div class="form-row mx-3">
            <div class="col-4">
              <label for="inputName">Фамилия</label>
              <input type="text" class="form-control" id="inputName" th:field="*{surname}">
            </div>
            <div class="col-4">
              <label for="inputPatronymic">Имя</label>
              <input type="text" class="form-control" id="inputPatronymic" th:field="*{name}">
            </div>
            <div class="col-4">
              <label for="inputSurname">Отчество</label>
              <input type="text" class="form-control" id="inputSurname" th:field="*{patronymic}">
            </div>
          </div>
          <div class="form-group mx-3">
            <label for="inputMemo">Примечание</label>
            <textarea class="form-control" id="inputMemo" rows="3" th:field="*{memo}"></textarea>
          </div>
          <div class="form-group mx-3">
            <label for="notesText">Прикрепить единицы хранения к именному указателю</label>
            <input type="text" class="form-control" id="notesText" name="notesText" placeholder="4_15_23_7">
          </div>
          <button class="btn btn-primary mx-3 my-3" type="submit">Изменить</button>
        </form>
    </div>

    <div class="card container col-7 border p-0">
      <div class="card-header">
        Единицы хранения, связанные с данным именным указателем
      </div>
      <div class="card-body">
        <table class="table table-bordered table-sm">
          <thead>
          <tr>
            <th scope="col">Номер единицы хранения</th>
            <th scope="col">Заголовок единицы хранения</th>
            <th scope="col">Открепить от единицы хранения </th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="note : ${actor.getNotes()}">
            <td>
              <a th:text="${note.number}"></a>
            </td>
            <td>
              <p th:text="${note.getAnnotation()}"></p>
            </td>
            <td>
              <a th:href="@{'/actors/' + ${note.getRegister().getId()} + '/actor/' + ${actor.getId()} + '/note/' + ${note.getId()} + '/actorDeleteRelationWithNote'}">Открепить</a>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>


<!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

</body>
</html>
