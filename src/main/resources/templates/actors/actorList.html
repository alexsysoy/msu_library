<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Дела</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <!--    note tables-->
    <table class="table table-striped mt-20 text-center">
        <caption>Просмотр дел именного указателя</caption>
        <thead>
        <tr>
            <th>Номер дела</th>
            <th>Аннотация</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="note : ${notes}">
            <td>
                <p><a th:text="${note.number}" th:href="@{'/notes/' + ${note.getRegisterId()} + '/note/' + ${note.getId()} + '/noteShow'}"></a></p>
            </td>
            <td>
                <p style="text-align: left" th:text="${note.getAnnotation()}"></p>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
