<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <!--    note table-->
    <table class="table table-striped mt-20 text-center" id="employeesTable">
        <caption>Список Дел</caption>
        <thead>
        <tr>
            <!-- sorting control via note id -->
            <th>
                <a th:href="@{'/registers/' + ${register.getId()} + '/noteList/page/' + ${currentPage} + '?sort-field=number&sort-dir=' + ${reverseSortDir}}">Номер</a>
            </th>
            <!-- sorting control via note name -->
            <th>
                <a th:href="@{'/registers/' + ${register.getId()} + '/noteList/page/' + ${currentPage} + '?sort-field=annotation&sort-dir=' + ${reverseSortDir}}">Аннотация</a>
            </th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="note : ${noteList}">
            <td th:text="${note.getNumber()}">Номер</td>
            <td th:text="${note.getAnnotation()}">Аннотация</td>
<!--            <td><a href="#" th:href="@{'register/' + ${register.getId()} + '/notes'}">Просмотр</a></td>-->
        </tr>
        </tbody>
    </table>
    <!-- pagination control -->
    <div th:if="${totalPages > 1}">
        <div class="row col-sm-10">
            <div class="col-sm-2">
                Всего Дел:        <strong>[[${totalItems}]]</strong>
            </div>
            <div class="col-sm-2">
					<span th:each="i: ${#numbers.sequence(1, totalPages)}">
						<a th:href="@{'/registers/' + ${register.getId()} + '/noteList/page/' + ${i} + '?sort-field=' + ${sortField} + '&sort-dir=' + ${sortDir}}"
                           th:if="${currentPage != i}">[[${i}]]</a>
						<span th:unless="${currentPage != i}">[[${i}]]</span>
					</span>
            </div>
            <div class="col-sm-2">
                <a th:href="@{'/registers/' + ${register.getId()} + '/noteList/page/' + ${currentPage + 1} + '?sort-field=' + ${sortField} + '&sort-dir=' + ${sortDir}}"
                   th:if="${currentPage < totalPages}">
                    Следующая
                </a>
                <span th:unless="${currentPage < totalPages}">Следующая</span>
            </div>
            <div class="col-sm-2">
                <a th:href="@{'/registers/' + ${register.getId()} + '/noteList/page/' + ${totalPages} + '?sort-field=' + ${sortField} + '&sort-dir=' + ${sortDir}}"
                   th:if="${currentPage < totalPages}">
                    Последняя
                </a>
                <span th:unless="${currentPage < totalPages}">Последняя</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
