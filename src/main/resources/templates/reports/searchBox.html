<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf.extras.springsecurity5">
<head>
  <title>Расширенный поиск</title>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
</head>

<body>
<!--Navbar-->
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <a class="navbar-brand" href="#">Расширенный поиск по описи</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarActionContent" aria-controls="navbarActionContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarActionContent">
    <ul class="navbar-nav mr-auto">
      <li class="navbar-brand">
        <a class="nav-link" th:href="@{'/'}" href="#">Фонд</a>
      </li>
      <li class="navbar-brand">
        <a class="nav-link" href="#" th:href="@{'/page/registers/' + ${note.getRegisterId()} + '/notes'}">Опись</a>
      </li>
    </ul>
    <form class="form-inline ml-2 my-2 my-lg-0" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
      <div class="navbar-brand" sec:authentication="name">Иван Иванов</div>
      <input class="btn btn-outline-danger" type="submit" value="Выйти из учетной записи"/>
    </form>
    <form class="form-inline ml-2 my-2 my-lg-0" th:action="@{/reports/searchResult}" method="post">
      <input type="text" name="wordToSearch" class="form-control mr-2" placeholder="Искать везде" aria-describedby="button-addon">
      <button class="btn btn-outline-success" type="submit" id="button-addon" >Найти</button>
    </form>
  </div>
</nav>

<br>
<div class="container border">
    <form  th:object="${note}" th:action="@{'/reports/' + ${note.getRegisterId()} + '/searchResult'} " method="post">
    <input type="hidden" th:field="*{id}"/>
    <div class="form-row mx-3 my-1">
      <div class="col-4">
        <label for = "inputNumber">Номер единицы хранения</label>
        <div class="p-0">
          <input type="number" class="form-control" id="inputNumber" th:field="*{number}">
        </div>
      </div>
      <div class="col-8">
        <label for="inputSubject">Предметный указатель</label>
        <input type="text" class="form-control" id="inputSubject" th:field="*{findSubject}">
      </div>
    </div>
    <div class="form-row mx-3">
      <div class="col-4">
        <label for="inputName">Фамилия</label>
        <input type="text" class="form-control" id="inputName" th:field="*{findSurnameActor}">
      </div>
      <div class="col-4">
        <label for="inputPatronymic">Имя</label>
        <input type="text" class="form-control" id="inputPatronymic" th:field="*{findNameActor}">
      </div>
      <div class="col-4">
        <label for="inputSurname">Отчество</label>
        <input type="text" class="form-control" id="inputSurname" th:field="*{findPatronymicActor}">
      </div>
    </div>
    <div class="form-group mx-3">
      <label for="inputAnnotation">Заголовок единицы хранения</label>
      <textarea class="form-control" id="inputAnnotation" rows="3" th:field="*{annotation}"></textarea>
    </div>
    <div class="form-group mx-3">
      <label for="inputMemo">Примечание</label>
      <textarea class="form-control" id="inputMemo" rows="3" th:field="*{memo}"></textarea>
    </div>
    <button class="btn btn-primary m-3" type="submit">Найти</button>
  </form>
</div>

<!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

</body>
</html>
