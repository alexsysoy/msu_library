<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Просмотр записи</title>

    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous"
          th:href="@{/webjars/bootstrap/3.3.7-1/css/bootstrap.min.css}">

    <script src="/webjars/jquery/1.11.1/jquery.min.js"></script>

    <!-- Latest compiled and minified JavaScript -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
            integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
            crossorigin="anonymous" th:src="@{/webjars/bootstrap/3.3.7-1/js/bootstrap.min.js}"></script>
</head>
<body>

<div class="container-fluid" style="margin-top: 20px">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="pannel-group">
                <div class="panel panel-primary">
                    <div class="panel-heading">
                        <div class="row">
                            <div class="col-md-3">
                                <th>Номер записи</th>
                                <h1 class="panel-title" th:text="${note.getNumber()}">55</h1>
                            </div>

<!--                            <div class="col-md-1">-->
<!--                                <a class="btn btn-default" href="#"-->
<!--                                   th:href="@{'/register/' + ${note.getId()} + '/image'}" role="button">Изменить фото</a>-->
<!--                            </div>-->
                        </div>
                    </div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-md-3">
                                <h5>Ключевые слова:</h5>
                            </div>
                            <div class="col-md-9">
                                <div th:each="subject : ${note.getSubjects()}">
                                    <a th:text="${subject.getName()}" th:href="@{'/index'}">Ссылка</a>
                                </div>
                            </div>
<!--                            <div class="col-md-3">-->
<!--                                <a th:text="${subject.getName()}" th:each="subject : ${note.getSubjects()}" th:href="@{'/index/'}">Ссылка</a>-->
<!--                            </div>-->
<!--Изображение-->
<!--                            <div class="col-md-6">-->
<!--                                <img src="../../static/images/guacamole400x400WithX.jpg"-->
<!--                                     th:src="@{'/register/' + ${register.id} + '/registerimage'}"-->
<!--                                     width="200" height="200">-->
<!--                            </div>-->
                        </div>
<!--Описание записи-->
                <div class="panel panel-primary">
                    <div class="panel-heading">
                        <h1 class="panel-title">Описание</h1>
                    </div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-md-12">
                                <p th:text="${note.getAnnotation()}">О доставлении у-ту См.Владимира некоторых сведений о испытаниях студентов и о проч.</p>
                            </div>
                        </div>
                    </div>
                </div>
<!--Дополнительные заметки-->
                <div class="panel panel-primary">
                    <div class="panel-heading">
                        <h1 class="panel-title">Примечание</h1>
                    </div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-md-12">
                                <p th:text="${note.getMemo()}">Тут могло бы быть Ваше примечание о данной заметке</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<!--            Навигация-->
            <div class="panel panel-primary">
                <div class="panel-heading">
                    <div class="row">
                        <div class="col-md-9">
                            <h1 class="panel-title">Навигация</h1>
                        </div>
                        <div class="col-md-1">
                            <a class="btn btn-default" href="#"
                               th:href="@{'/register/' + ${note.getRegisterId()} + '/notes'}" role="button">Дела</a>
                        </div>
                        <div class="col-md-1">
                            <a class="btn btn-default" href="#"
                               th:href="@{'/index'}" role="button">Описи</a>
                        </div>
                    </div>
                </div>
            </div>
</div>
</body>
</html>
