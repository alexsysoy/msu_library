<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
  <title>Добавление пользователя</title>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" integrity="sha384-B0vP5xmATw1+K9KRQjQERJvTumQW0nPEzvF6L/Z6nronJ3oUOFUFpCjEUQouq2+l" crossorigin="anonymous">
</head>

<body>
<!--Navbar-->
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <li class="navbar-brand">
        <div class="nav-link">Добавление учетной записи</div>
      </li>
      <li class="navbar-brand">
        <a th:href="@{'/'}" role="button" href="#" class="nav-link">Фонд</a>
      </li>
      <li class="navbar-brand dropdown" sec:authorize="hasAuthority('ROLE_ADMIN')">
        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          Администрирование
        </a>
        <div class="dropdown-menu" aria-labelledby="navbarDropdown">
          <a class="dropdown-item" th:href="@{'/registers/registerCreate'}" role="button">Добавить опись</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="#">Добавить файл</a>
          <a class="dropdown-item" href="#">Добавить изображение</a>
        </div>
      </li>
      <li class="navbar-brand dropdown" sec:authorize="hasAnyAuthority('ROLE_ADMIN','ADMIN')">
        <a class="nav-link dropdown-toggle" href="#" id="adminDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          Управление учетными записями
        </a>
        <div class="dropdown-menu" aria-labelledby="adminDropdown">
          <a class="dropdown-item" th:href="@{'/registration'}" role="button">Добавить пользователя</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" th:href="@{'/user'}" role="button">Просмотреть данные пользователей</a>
        </div>
      </li>
    </ul>
    <form class="form-inline ml-2 my-2 my-lg-0" sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
      <div class="navbar-brand" sec:authentication="name">Иван Иванов</div>
      <input class="btn btn-outline-danger" type="submit" value="Выйти"/>
    </form>
    <form class="form-inline ml-2 my-2 my-lg-0">
      <input class="form-control mr-2" type="search" placeholder="Искать везде" aria-label="Search">
      <button class="btn btn-outline-success" type="submit">Найти</button>
    </form>
  </div>
</nav>
<br>

<div class="container">

  <div th:if="${message}">
    <p th:text="${message}"></p>
  </div>
  <div th:if="${param.error}">
    Ошибочно введены логин или пароль
  </div>
  <div th:if="${param.logout}">
    Вы вышли из учетной записи
  </div>

    <form th:action="@{/registration}" method="post">
      <div class="row">
        <div class="form-group col-6">
          <label for="InputName">Имя пользователя</label>
          <input type="text" class="form-control" id="InputName" aria-describedby="emailHelp" name="username">
        </div>
        <div class="form-group col-6">
          <label for="InputPassword">Пароль</label>
          <input type="password" class="form-control" id="InputPassword" name="password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Добавить</button>
    </form>
  </div>

<!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-Piv4xVNRyMGpqkS2by6br4gNJ7DXjqk09RmUpJ8jgGtD7zP9yug3goQfGII0yAns" crossorigin="anonymous"></script>

</body>
</html>
